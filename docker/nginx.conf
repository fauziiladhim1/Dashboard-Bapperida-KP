# Lapisan pertama anti brute-force login (per IP, sebelum sampai Node). Limit per IP + per email ada juga di API.
# $binary_remote_addr = IP asli selama tidak ada proxy lain di depan nginx ini (lihat TRUST_PROXY di compose).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  # Worker MapLibre berupa ES module (.mjs); tanpa tipe ini browser menolaknya karena nosniff.
  # Cache selamanya: map.tsx memuat worker dengan ?v=<versi maplibre>, jadi upgrade = URL baru.
  location /vendor/ {
    types { text/javascript mjs; }
    expires max;
    try_files $uri =404;
  }
  client_max_body_size 55m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/geo+json application/vnd.mapbox-vector-tile text/csv;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  # Basemap mapcn memakai tile & style CARTO; MapLibre menjalankan worker dari blob:.
  # Raster & identify bahaya InaRISK diambil langsung dari ImageServer BNPB (fetch -> connect-src).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.cartocdn.com; connect-src 'self' https://*.cartocdn.com https://gis.bnpb.go.id; worker-src 'self' blob:; child-src blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Aset hasil build memakai hash di nama file -> aman di-cache selamanya.
  location /assets/ {
    expires max;
    access_log off;
    try_files $uri =404;
  }

  # Logo & favicon di root public/: tidak di-hash, cache 30 hari.
  location ~* ^/(logo-[^/]+.webp|favicon.png)$ {
    expires 30d;
    try_files $uri =404;
  }

  location = /api/v1/auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API, vector tile, dan foto (foto butuh login, jadi lewat API).
  location ~ ^/(api|uploads)/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # SPA: index.html selalu divalidasi ulang agar versi baru langsung terpakai.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
